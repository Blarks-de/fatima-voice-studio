# Publishes the help guides (studio/help) as a website on GitHub Pages: https://hassanxs.github.io/fatima-voice-studio/
# Runs when the guides or the site's setup change on main. The build is strict: a broken link fails it.
name: Help website

on:
  push:
    branches: [main]
    paths: ["studio/help/**", "mkdocs.yml", "docs/site/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the site
        run: |
          python -m pip install -r docs/site/requirements.txt
          mkdocs build --strict

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
