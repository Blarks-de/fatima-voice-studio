# Builds s2.cpp (https://github.com/rodrigomatta/s2.cpp), the C++/ggml engine for Fish Audio S2 Pro, the app's second
# voice engine, and publishes the builds as their own release (tag input below). The app downloads the one matching
# the voice engine a PC uses:
#
#   cuda-13.4 -> voice engine "cuda" (RTX 20 series and newer); loads cuBLAS 13 / cudart 13 from that engine's folder
#   vulkan    -> voice engine "vulkan" (AMD, Intel, NVIDIA); needs only the graphics driver
#
# What goes in: s2.cpp at a fixed commit, pull requests #50 (faster generation: flash attention, CUDA graphs), #51
# (single-pass audio decode, so the decoder fits on 8 GB cards) and #52 (CUDA fixes, faster im2col), each at a fixed
# commit, plus packaging/s2cpp/seed.patch (--seed / "seed": repeatable takes) and two build fixes (below).
# Run it by hand; app releases don't.
name: s2.cpp builds

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "s2.cpp commit to build"
        required: true
        default: "2c33261938da1a41d713768b1b391b4d368d7d2c"
      prs:
        description: "Pull requests to merge on top, as number@commit (space separated); empty for none"
        required: false
        default: "50@49bb869e2399555ab23be1d6ec4b8aa67c0b6a3c 51@f468f9d70e269855f67c2c7e0080071263edb40b 52@68ebea3f66e143ad58e326d11aee2b1817c1ae9c"
      release:
        description: "Release tag to publish (empty: keep the zips as workflow artifacts only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: s2.cpp ${{ matrix.backend }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cuda-13.4
            defines: -DS2_CUDA=ON  # s2.cpp's ggml is older than llama.cpp's: CUDA 13.4's own CCCL, not v3.4.3
          - backend: vulkan
            defines: -DS2_VULKAN=ON
    env:
      VULKAN_VERSION: 1.4.357.0
    steps:
      - name: Keep line endings as they are (so patches apply)
        run: git config --global core.autocrlf false

      - name: Get s2.cpp
        uses: actions/checkout@v4
        with:
          repository: rodrigomatta/s2.cpp
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Get this project's patches
        uses: actions/checkout@v4
        with:
          path: fvs
          sparse-checkout: packaging/s2cpp

      - name: Merge pull requests
        if: inputs.prs != ''
        shell: pwsh
        run: |
          foreach ($p in "${{ inputs.prs }}".Split(" ", [StringSplitOptions]::RemoveEmptyEntries)) {
            $num, $sha = $p.Split("@")
            git fetch --no-tags --no-recurse-submodules origin $sha  # the PRs keep ggml where it is
            if ($LASTEXITCODE) { throw "Couldn't fetch PR #$num at $sha" }
            git -c user.name=build -c user.email=build@localhost merge --no-edit $sha
            if ($LASTEXITCODE) { throw "PR #$num doesn't merge cleanly" }
            Write-Host "Merged PR #$num ($sha)"
          }
          git submodule status

      - name: Apply this project's patches
        shell: pwsh
        run: |
          foreach ($p in Get-ChildItem fvs\packaging\s2cpp\*.patch) {
            git apply --verbose $p.FullName
            if ($LASTEXITCODE) { throw "$($p.Name) doesn't apply" }
          }

      # The same CUDA components and versions as llama.cpp's Windows builds of the voice engine (b11476).
      - name: Install CUDA 13.4
        if: matrix.backend == 'cuda-13.4'
        shell: pwsh
        run: |
          $root = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.4"
          $base = "https://developer.download.nvidia.com/compute/cuda/redist"
          $parts = @(
            "cuda_crt/windows-x86_64/cuda_crt-windows-x86_64-13.4.59-archive.zip",
            "cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-13.4.49-archive.zip",
            "cuda_nvcc/windows-x86_64/cuda_nvcc-windows-x86_64-13.4.59-archive.zip",
            "cuda_nvrtc/windows-x86_64/cuda_nvrtc-windows-x86_64-13.4.59-archive.zip",
            "libcublas/windows-x86_64/libcublas-windows-x86_64-13.7.0.27-archive.zip",
            "libnvvm/windows-x86_64/libnvvm-windows-x86_64-13.4.59-archive.zip",
            "cuda_nvtx/windows-x86_64/cuda_nvtx-windows-x86_64-13.4.49-archive.zip",
            "cuda_profiler_api/windows-x86_64/cuda_profiler_api-windows-x86_64-13.4.49-archive.zip",
            "visual_studio_integration/windows-x86_64/visual_studio_integration-windows-x86_64-13.4.49-archive.zip",
            "cccl/windows-x86_64/cccl-windows-x86_64-13.3.4.2.1-archive.zip")
          New-Item -ItemType Directory -Force $root | Out-Null
          foreach ($p in $parts) {
            $zip = Join-Path $env:RUNNER_TEMP (Split-Path $p -Leaf)
            curl.exe -sSfL -o $zip "$base/$p"
            7z x $zip -o"$env:RUNNER_TEMP\cuda" -y | Out-Null
          }
          Get-ChildItem "$env:RUNNER_TEMP\cuda" -Directory | ForEach-Object {
            robocopy $_.FullName $root /E /NFL /NDL /NJH /NJS | Out-Null
            if ($LASTEXITCODE -ge 8) { throw "Copying $($_.Name) failed (robocopy $LASTEXITCODE)" }  # 1-7 mean copied
          }
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CUDA_PATH=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CUDA_PATH_V13_4=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          exit 0

      - name: Install the Vulkan SDK
        if: matrix.backend == 'vulkan'
        shell: pwsh
        run: |
          curl.exe -sSfL -o "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "C:\VulkanSDK\$env:VULKAN_VERSION\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # s2.cpp applies its own ggml patches with `patch` (Git for Windows has it). Build fixes:
      # - (std::max)(...) compiles with and without Windows' max macro (PR #48's plain std::max needs NOMINMAX);
      # - its ggml uses cuda::make_counting_iterator / cuda::discard_iterator in top-k.cu without including
      #   <cuda/iterator>, where CCCL 3.4 (CUDA 13.4) keeps them; newer ggml includes it.
      - name: Prepare
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          "C:\Program Files\Git\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Get-Content src\main.cpp -Raw) -replace '= max\(0, std::stoi', '= (std::max)(0, std::stoi' | Set-Content src\main.cpp -NoNewline
          $topk = "ggml\src\ggml-cuda\top-k.cu"
          (Get-Content $topk -Raw) -replace '(#\s*include <cub/cub.cuh>)', "`$1`n#    if __has_include(<cuda/iterator>)`n#        include <cuda/iterator>`n#    endif" | Set-Content $topk -NoNewline

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF ${{ matrix.defines }}
          if errorlevel 1 exit /b 1
          set /A JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %JOBS% --target s2

      # The licence asks redistributions to carry it and this notice.
      - name: Pack
        shell: pwsh
        run: |
          $out = "pack"
          New-Item -ItemType Directory -Force $out | Out-Null
          Get-ChildItem build -Recurse -Include s2.exe, *.dll | Where-Object { $_.FullName -notmatch '\\CMakeFiles\\' } | Copy-Item -Destination $out
          Copy-Item LICENSE.md "$out\LICENSE.md"
          Copy-Item tokenizer.json $out
          @"
          This model is licensed under the Fish Audio Research License, Copyright © 39 AI, INC. All Rights Reserved.

          Built with Fish Audio. This is s2.cpp (${{ inputs.ref }}, https://github.com/rodrigomatta/s2.cpp), changed for
          Fatima Voice Studio: pull requests ${{ inputs.prs }} merged; packaging/s2cpp/seed.patch (a --seed option and a
          "seed" server parameter for repeatable takes); (std::max) in src/main.cpp; <cuda/iterator> in ggml's top-k.cu.
          Backend: ${{ matrix.backend }}.
          "@ | Out-File "$out\NOTICE.txt" -Encoding utf8
          Get-ChildItem $out | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table | Out-String | Write-Host
          if (-not (Test-Path "$out\s2.exe")) { throw "s2.exe wasn't built" }
          & "$out\s2.exe" --help | Select-String -- '--seed' | Out-String | Write-Host
          Compress-Archive -Path "$out\*" -DestinationPath "s2cpp-win-${{ matrix.backend }}-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: s2cpp-${{ matrix.backend }}
          path: s2cpp-*.zip

  publish:
    needs: build
    if: inputs.release != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # --latest=false: the app's updater reads the latest release, which must stay the newest app version.
      - name: Publish release ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          {
            echo "s2.cpp (Fish Audio S2 Pro engine), built for Fatima Voice Studio. The app downloads the one matching your"
            echo "voice engine by itself; there's nothing to install by hand."
            echo
            echo "| File | Voice engine | Cards |"
            echo "|---|---|---|"
            echo "| cuda-13.4 | NVIDIA · CUDA | GeForce RTX 20 series and newer |"
            echo "| vulkan | AMD / Intel · Vulkan | AMD Radeon, Intel Arc, NVIDIA (slower) |"
            echo
            echo "s2.cpp ${{ inputs.ref }} with pull requests ${{ inputs.prs }} and packaging/s2cpp/seed.patch."
            echo "Fish Audio Research License (LICENSE.md and NOTICE.txt in each zip). Built with Fish Audio."
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > notes.md
          gh release create "${{ inputs.release }}" *.zip SHA256SUMS.txt \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "s2.cpp for S2 Pro (${{ inputs.release }})" --notes-file notes.md --latest=false
