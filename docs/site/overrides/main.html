{% extends "base.html" %}
{# The app's colours (studio/web/app.css) on the help website: dark bar, warm paper, indigo accent. #}
{% block extrahead %}
<style>
  [data-md-color-scheme="default"] {
    --md-primary-fg-color: #20221e; --md-primary-fg-color--light: #34362f; --md-primary-fg-color--dark: #0d0e0c;
    --md-accent-fg-color: #3039c4; --md-typeset-a-color: #3f4ae0;
    --md-default-bg-color: #f3f0e7; --md-code-bg-color: #e8e7dd; --md-footer-bg-color: #20221e;
  }
  [data-md-color-scheme="slate"] {
    --md-primary-fg-color: #0d0e0c; --md-primary-fg-color--light: #2a2c27; --md-primary-fg-color--dark: #0d0e0c;
    --md-accent-fg-color: #868dff; --md-typeset-a-color: #6d76ff;
    --md-default-bg-color: #161714; --md-default-bg-color--light: #1e1f1c; --md-code-bg-color: #2a2c27;
    --md-footer-bg-color: #0d0e0c;
  }
  .md-typeset img { border: 1px solid var(--md-default-fg-color--lightest); border-radius: 8px; }
  .md-typeset blockquote { border-left-color: #3f4ae0; color: inherit; }
  .md-header__button.md-logo img { border-radius: 6px; }
</style>
{% endblock %}
